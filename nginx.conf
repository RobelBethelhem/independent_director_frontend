# Serves the built SPA and reverse-proxies /api to the backend container so the
# browser sees a single same-origin host (no CORS needed for the on-prem stack).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in the Server response header —
    # reduces reconnaissance (turns "nginx/1.27.5" into just "nginx").
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Backend API — path is forwarded unchanged (backend already expects /api/v1/...).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    # Document storage (MinIO), same-origin — the backend hands the browser
    # presigned PUT/GET URLs under this same path (S3_PUBLIC_ENDPOINT), so the
    # browser never needs to resolve the Docker-internal "minio" hostname, and
    # no separate storage port/firewall rule is needed. Host MUST be preserved
    # BYTE-FOR-BYTE: it's part of what the presigned URL's SigV4 signature
    # covers. Deliberately $http_host, not $host — nginx's $host silently
    # strips the port (e.g. "localhost:18080" -> "localhost"), which still
    # matches the API's requirements but breaks MinIO's signature check
    # (SignatureDoesNotMatch) whenever the public endpoint has a non-default
    # port, which on this on-prem deployment it always does.
    # Bucket name is hardcoded here to match S3_BUCKET in backend.env — update
    # both together if it's ever changed.
    location /zemen-documents/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        client_max_body_size 15m;
    }

    # SPA routing — unknown paths fall back to index.html (mirrors vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
